<!doctype html><html lang=es><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>IZIDA Cliente</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f5f2fb;color:#17132a}.app{max-width:480px;margin:auto;background:#fff;min-height:100vh}.hero{background:linear-gradient(135deg,#5c2cdf,#8d56ef);color:#fff;padding:24px;border-radius:0 0 28px 28px}.logo{font-size:28px;font-weight:800}.bal{font-size:38px;font-weight:800;margin:18px 0}.content{padding:16px}.card{background:#fff;border:1px solid #eee5fa;border-radius:18px;padding:16px;margin-bottom:14px}.input{width:100%;padding:12px;border:1px solid #ddd5e9;border-radius:11px;margin:5px 0}.btn{padding:12px;border:0;border-radius:11px;background:#6332df;color:white;font-weight:700;cursor:pointer}.wide{width:100%;margin-top:7px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.item{padding:11px 0;border-bottom:1px solid #eee}.hide{display:none}.danger{color:#b22}.small{font-size:12px;color:#777}.pill{display:inline-block;padding:5px 8px;border-radius:20px;background:#eee7ff;color:#5630c8;font-size:12px}</style>
<div class=app><div id=login class=content><div class=card><div class=logo>IZIDA</div><h2>Mi billetera</h2><input id=u class=input placeholder=Usuario><input id=p class=input type=password placeholder=Contraseña><button class="btn wide" onclick=login()>Ingresar</button><p id=err class=danger></p><hr><h3>Crear cuenta IZIDA</h3><input id=n class=input placeholder="Nombre completo"><input id=d class=input placeholder="Documento"><input id=t class=input placeholder="Teléfono"><input id=em class=input placeholder="Correo"><input id=nu class=input placeholder="Usuario"><input id=np class=input type=password placeholder="Contraseña"><button class="btn wide" onclick=register()>Crear cuenta</button><p id=regmsg></p></div></div>
<div id=main class=hide><div class=hero><div class=logo>IZIDA</div><div id=hello></div><div id=balance class=bal>S/ 0.00</div><div>Saldo disponible · PEN</div><div class=actions><button class=btn onclick=abono()>Abonar</button><button class=btn onclick=retirar()>Retirar</button><button class=btn onclick=enviar()>Enviar</button><button class=btn onclick=pagar()>Pagar</button></div></div><div class=content>
<div class=card><div style="display:flex;justify-content:space-between"><h3>Actividad</h3><button class=btn onclick=load()>↻</button></div><div id=mov></div></div>
<div class=card><h3>Mis créditos</h3><div id=credits></div><button class="btn wide" onclick=pagarCredito()>Pagar cuota</button></div>
<div class=card><h3>Mis inversiones</h3><div id=investments></div><button class="btn wide" onclick=invierte()>Nueva inversión</button></div>
<div class=card><h3>Ofertas IZIDA</h3><div id=campaigns></div></div>
<button class="btn wide" onclick=logout()>Cerrar sesión</button></div></div></div>
<script>
const API=location.origin+"/api";let T=localStorage.izida_client_token||"";
async function api(p,o={}){o.headers={...(o.headers||{}),...(T?{Authorization:"Bearer "+T}:{})};if(o.body)o.headers["Content-Type"]="application/json";let r=await fetch(API+p,o),j=await r.json().catch(()=>({detail:"Error"}));if(!r.ok)throw Error(j.detail||"Error");return j}
async function login(){try{let j=await api("/client/login",{method:"POST",body:JSON.stringify({username:u.value,password:p.value})});T=j.token;localStorage.izida_client_token=T;show();load()}catch(x){err.textContent=x.message}}
async function register(){try{await api("/client/register",{method:"POST",body:JSON.stringify({name:n.value,document:d.value,phone:t.value,email:em.value,username:nu.value,password:np.value})});regmsg.textContent="Cuenta creada. Ya puedes ingresar."}catch(x){regmsg.textContent=x.message}}
function show(){login.classList.add("hide");main.classList.remove("hide")}
async function load(){try{let j=await api("/client/home");hello.textContent="Hola, "+j.client.name;balance.textContent="S/ "+(+j.wallet.balance).toFixed(2);mov.innerHTML=j.movements.map(x=>`<div class=item><b>${x.type}</b><span style=float:right>${(+x.amount).toFixed(2)}</span><div class=small>${x.description||""} · ${x.created_at}<br>Ref: ${x.reference||""}</div></div>`).join("")||"Sin movimientos";credits.innerHTML=j.credits.map(x=>`<div class=item><b>Crédito #${x.id}</b><br>S/ ${(+x.amount).toFixed(2)} · ${x.status}<br><span class=small>Saldo pendiente: S/ ${(+x.remaining).toFixed(2)} · Cuota: S/ ${(+x.installment).toFixed(2)}</span></div>`).join("")||"Sin créditos";investments.innerHTML=j.investments.map(x=>`<div class=item><b>${x.currency} ${(+x.amount).toFixed(2)}</b><br><span class=small>${x.status} · Vence ${x.maturity_date}</span></div>`).join("")||"Sin inversiones";campaigns.innerHTML=j.campaigns.map(x=>`<div class=item><span class=pill>${x.rate}%</span> <b>${x.name}</b><br>${x.description}</div>`).join("")||"Sin ofertas disponibles"}catch(x){logout()}}
async function abono(){let a=prompt("Monto de abono en PEN");if(a)try{let j=await api("/client/deposit",{method:"POST",body:JSON.stringify({amount:+a,description:"Abono IZIDA"})});alert("Operación: "+j.reference);load()}catch(x){alert(x.message)}}
async function retirar(){let a=prompt("Monto a retirar en PEN");if(a)try{let j=await api("/client/withdraw",{method:"POST",body:JSON.stringify({amount:+a,description:"Retiro IZIDA"})});alert("Operación: "+j.reference);load()}catch(x){alert(x.message)}}
async function enviar(){let d=prompt("Usuario IZIDA destinatario"),a=prompt("Monto PEN");if(d&&a)try{let j=await api("/client/transfer",{method:"POST",body:JSON.stringify({destination_username:d,amount:+a,description:"Transferencia IZIDA"})});alert("Transferencia: "+j.reference);load()}catch(x){alert(x.message)}}
async function pagar(){let d=prompt("Usuario IZIDA a quien pagar"),a=prompt("Monto PEN"),c=prompt("Concepto","Pago IZIDA");if(d&&a)try{let j=await api("/client/pay",{method:"POST",body:JSON.stringify({destination_username:d,amount:+a,concept:c})});alert("Pago: "+j.reference);load()}catch(x){alert(x.message)}}
async function pagarCredito(){let a=prompt("Monto de pago PEN");if(a)try{let j=await api("/client/credit-payment",{method:"POST",body:JSON.stringify({amount:+a})});alert("Pago registrado. Pendiente: S/ "+j.remaining);load()}catch(x){alert(x.message)}}
async function invierte(){let a=prompt("Monto"),c=(prompt("Moneda: PEN o USD","PEN")||"").toUpperCase(),r=prompt("Tasa anual %","0"),days=prompt("Plazo en días","30");if(a&&c)try{await api("/client/investment",{method:"POST",body:JSON.stringify({amount:+a,currency:c,rate:+r,term_days:+days})});load()}catch(x){alert(x.message)}}
async function logout(){await api("/logout",{method:"POST"}).catch(()=>{});localStorage.removeItem("izida_client_token");location.reload()}if(T){show();load()}
</script>
