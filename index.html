<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IZIDA | Cliente</title><style>
body{margin:0;background:#f5f6fb;font-family:Arial;color:#182033}.app{max-width:480px;margin:auto;background:#fff;min-height:100vh}.hero{background:linear-gradient(145deg,#25105c,#702bd0);color:#fff;padding:25px 20px 30px;border-radius:0 0 28px 28px}.brand{font-size:28px;font-weight:900}.bal{font-size:38px;font-weight:800;margin-top:28px}.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:16px}.act{border:0;background:#eee8ff;color:#4f1eaa;border-radius:15px;padding:12px 3px;font-weight:800}.card{margin:0 16px 16px;padding:16px;border:1px solid #ececf2;border-radius:18px}.row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #eee}.in{color:#078d68}.out{color:#d34b59}input,button{width:100%;padding:12px;margin:5px 0;border-radius:10px;border:1px solid #ddd;box-sizing:border-box}button{background:#5420b5;color:#fff;border:0;font-weight:800}</style></head><body><main class="app"><section class="hero"><div class="brand">IZIDA</div><small>Tu billetera digital</small><div class="bal" id="bal">S/ 0.00</div><small>Saldo disponible · PEN</small></section><div class="actions"><button class="act" onclick="send()">↗<br>Enviar</button><button class="act" onclick="alert('QR de cobro preparado para integración oficial')">▣<br>Cobrar</button><button class="act" onclick="alert('Pago QR en soles')">⌁<br>Pagar</button><button class="act" onclick="alert('Inversiones PEN/USD · Créditos PEN · Servicios')">•••<br>Más</button></div><section class="card"><h3>Movimientos</h3><div id="tx">Inicia sesión.</div></section><section class="card"><h3>Créditos</h3><div id="cr">Créditos disponibles en soles.</div></section><section class="card"><h3>Inversiones</h3><div id="iv">Inversiones disponibles en PEN y USD.</div></section><section class="card"><h3>Acceso</h3><input id="u" placeholder="Usuario IZIDA"><input id="p" type="password" placeholder="PIN"><button onclick="login()">Ingresar</button></section></main><script>
const A=localStorage.IZIDA_API||"http://localhost:8000/api";let cid,wid;async function api(x,o={}){let r=await fetch(A+x,{headers:{"Content-Type":"application/json"},...o});if(!r.ok)throw Error();return r.json()}
async function login(){try{let x=await api("/client/login",{method:"POST",body:JSON.stringify({username:u.value,pin:p.value})});cid=x.client_id;let h=await api("/client/"+cid+"/home");wid=h.wallet.id;bal.textContent="S/ "+h.wallet.balance.toFixed(2);tx.innerHTML=h.transactions.map(t=>{let q=["DEPOSIT","TRANSFER_IN","CREDIT_DISBURSEMENT"].includes(t.type);return `<div class="row"><span>${t.description}</span><b class="${q?"in":"out"}">${q?"+":"-"} S/ ${t.amount.toFixed(2)}</b></div>`}).join("")||"Sin movimientos";cr.innerHTML=h.credits.map(c=>`<div class="row"><span>Crédito #${c.id}<br>${c.status}</span><b>S/ ${c.amount.toFixed(2)}</b></div>`).join("")||"Sin créditos";iv.innerHTML=h.investments.map(i=>`<div class="row"><span>Inversión #${i.id}</span><b>${i.currency==="USD"?"US$":"S/"} ${i.principal.toFixed(2)}</b></div>`).join("")||"Sin inversiones"}catch(e){alert("Usuario o PIN incorrecto")}}
async function send(){if(!wid)return alert("Inicia sesión");let d=prompt("ID de billetera destino"),a=prompt("Monto en S/");if(d&&a){try{await api("/wallets/"+wid+"/transfer",{method:"POST",body:JSON.stringify({destination_wallet_id:+d,amount:+a,description:"Transferencia IZIDA"})});await login();alert("Transferencia realizada")}catch(e){alert("No se pudo realizar")}}}
</script></body></html>
