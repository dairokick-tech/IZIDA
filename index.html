<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>IZIDA | Billetera Digital</title>
<meta name="theme-color" content="#6d28d9">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#f5f3ff;color:#171329}
button,input,select{font:inherit}button{cursor:pointer;border:0}.wrap{max-width:1050px;margin:auto;padding:18px}
header{background:#fff;border-bottom:1px solid #e8e4f4;position:sticky;top:0;z-index:5}
.nav{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:24px;color:#5b21b6}.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,#7c3aed,#4f46e5);color:#fff;display:grid;place-items:center;font-weight:900}
.card{background:#fff;border:1px solid #e7e2f3;border-radius:20px;padding:20px;box-shadow:0 8px 25px rgba(38,18,83,.06);margin:14px 0}.hero{padding:30px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
h1{font-size:34px;margin:8px 0}h2{margin:0 0 12px}h3{margin:8px 0}.muted{color:#6b647a}.small{font-size:13px}.hidden{display:none!important}
input,select{width:100%;padding:14px;border:1px solid #ddd6ee;border-radius:14px;outline:none;background:#fff;margin:6px 0 10px}input:focus,select:focus{border-color:#7c3aed;box-shadow:0 0 0 3px #ede9fe}
.btn{padding:13px 16px;border-radius:13px;font-weight:800}.primary{background:#6d28d9;color:#fff}.secondary{background:#ede9fe;color:#5b21b6}.danger{background:#fee2e2;color:#991b1b}.ghost{background:#fff;border:1px solid #ddd6ee;color:#33294a}
.actions{display:flex;flex-wrap:wrap;gap:9px}.balance{background:linear-gradient(135deg,#5b21b6,#7c3aed);color:#fff;border-radius:22px;padding:24px}.balance strong{font-size:36px;display:block;margin-top:8px}
.msg{padding:12px;border-radius:12px;margin:10px 0;background:#f3f4f6}.ok{background:#dcfce7;color:#166534}.err{background:#fee2e2;color:#991b1b}
.tabs{display:flex;gap:8px;margin:12px 0;overflow:auto}.tab{white-space:nowrap;padding:10px 13px;border-radius:12px;background:#eee9fa;color:#4c3b69;font-weight:700}.tab.active{background:#6d28d9;color:#fff}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #eee8f5;font-size:14px}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#ede9fe;color:#5b21b6;font-size:12px;font-weight:800}
footer{padding:30px 0 60px;color:#766e87;text-align:center}.topline{display:flex;justify-content:space-between;align-items:center;gap:10px}
@media(max-width:720px){.grid,.grid3{grid-template-columns:1fr}.wrap{padding:14px}h1{font-size:28px}.card{padding:16px}.balance strong{font-size:31px}}
</style>
</head>
<body>
<header><div class="wrap nav">
  <div class="brand"><div class="logo">IZ</div> IZIDA · ADMIN</div>
  <a class="btn ghost" href="../">Ir a la billetera</a>
</div></header>
<main class="wrap">
<section id="auth" class="hidden"></section>
<section id="client" class="hidden"></section>
<section id="admin">
  <div class="topline"><div><h1>Panel administrativo</h1><p class="muted">Acceso directo · sin usuario ni contraseña</p></div><a class="btn ghost" href="../">Salir al cliente</a></div>
  <div id="adminPanel">
    <div class="grid3">
      <div class="card"><span class="muted">Clientes</span><h2 id="mClients">0</h2></div>
      <div class="card"><span class="muted">Saldo PEN</span><h2 id="mBalance">S/ 0.00</h2></div>
      <div class="card"><span class="muted">Movimientos</span><h2 id="mMovs">0</h2></div>
    </div>
    <div class="tabs">
      <button class="tab active" onclick="showAdminTab('dash',this)">Dashboard</button>
      <button class="tab" onclick="showAdminTab('clients',this)">Clientes</button>
      <button class="tab" onclick="showAdminTab('movs',this)">Movimientos</button>
      <button class="tab" onclick="showAdminTab('credits',this)">Créditos</button>
      <button class="tab" onclick="showAdminTab('campaigns',this)">Campañas</button>
      <button class="tab" onclick="showAdminTab('invest',this)">Inversiones</button>
      <button class="tab" onclick="showAdminTab('investors',this)">Inversores</button>
      <button class="tab" onclick="showAdminTab('capital',this)">Capital</button>
      <button class="tab" onclick="showAdminTab('audit',this)">Auditoría</button>
    </div>
    <div id="adminContent" class="card"></div>
  </div>
</section>
</main>
<footer>IZIDA · Panel administrativo independiente.</footer>
<script>
const KEY='izida_static_v2';
let db=JSON.parse(localStorage.getItem(KEY)||'null');
if(!db){db={clients:[],movements:[],credits:[],creditPayments:[],campaigns:[],investments:[],investors:[],capital:[],audit:[],nextId:1};save()}
else {db.clients=db.clients||[];db.movements=db.movements||[];db.credits=db.credits||[];db.creditPayments=db.creditPayments||[];db.campaigns=db.campaigns||[];db.investments=db.investments||[];db.investors=db.investors||[];db.capital=db.capital||[];db.audit=db.audit||[];db.nextId=db.nextId||1;save()}
let current=null;

function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function id(){return db.nextId++}
function money(n,c='PEN'){return (c==='USD'?'US$ ':'S/ ')+Number(n||0).toFixed(2)}
function msg(el,text,ok=false){document.getElementById(el).innerHTML='<div class="msg '+(ok?'ok':'err')+'">'+esc(text)+'</div>'}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function client(){return db.clients.find(x=>x.id===current)}
function log(type,detail){db.audit.unshift({id:id(),at:new Date().toLocaleString('es-PE'),type,detail});save()}

function register(){
 const name=regName.value.trim(),doc=regDoc.value.trim(),phone=regPhone.value.trim(),email=regEmail.value.trim(),user=regUser.value.trim().toLowerCase(),pass=regPass.value;
 if(!name||!doc||!phone||!email||!user||!pass)return msg('regMsg','Completa todos los campos.');
 if(db.clients.some(x=>x.username===user))return msg('regMsg','Ese usuario ya existe.');
 const c={id:id(),name,doc,phone,email,username:user,password:pass,balance:0,created:new Date().toLocaleString('es-PE')};
 db.clients.push(c);save();log('Registro','Nuevo cliente '+user);msg('regMsg','Cuenta creada correctamente. Ya puedes ingresar.',true);
 ['regName','regDoc','regPhone','regEmail','regUser','regPass'].forEach(x=>document.getElementById(x).value='')
}
function login(){
 const u=loginUser.value.trim().toLowerCase(),p=loginPass.value;
 const c=db.clients.find(x=>x.username===u&&x.password===p);
 if(!c)return msg('loginMsg','Usuario o contraseña incorrectos.');
 current=c.id;log('Login cliente',u);show('client');refreshClient();
}
function adminLogin(){ show('admin'); document.getElementById('adminPanel').classList.remove('hidden'); showAdminTab('dash'); refreshAdmin(); }
function show(idn){['auth','client','admin'].forEach(x=>document.getElementById(x).classList.add('hidden'));document.getElementById(idn).classList.remove('hidden')}
function logout(){current=null;show('admin'); document.getElementById('adminPanel').classList.remove('hidden'); showAdminTab('dash'); refreshAdmin();document.getElementById('adminPanel').classList.add('hidden');document.getElementById('actionBox').classList.add('hidden')}


function openAction(type){
 const box=document.getElementById('actionBox');box.classList.remove('hidden');
 const titles={deposit:'Abonar saldo interno',withdraw:'Retirar saldo interno',transfer:'Enviar a otro usuario',pay:'Pagar a otro usuario',creditPay:'Pagar crédito',invest:'Crear inversión'};
 let html='<h2>'+titles[type]+'</h2><div id="actMsg"></div>';
 if(type==='deposit'||type==='withdraw') html+='<input id="actAmount" type="number" min="0.01" step="0.01" placeholder="Monto en PEN">';
 if(type==='transfer'||type==='pay') html+='<input id="actUser" placeholder="Usuario destino"><input id="actAmount" type="number" min="0.01" step="0.01" placeholder="Monto en PEN">';
 if(type==='creditPay') html+='<select id="actCredit">'+db.credits.filter(x=>x.clientId===current&&x.status==='approved'&&x.remaining>0).map(x=>'<option value="'+x.id+'">Crédito #'+x.id+' · saldo '+money(x.remaining)+'</option>').join('')+'</select><input id="actAmount" type="number" min="0.01" step="0.01" placeholder="Monto">';
 if(type==='invest') html+='<select id="actCurrency"><option value="PEN">PEN</option><option value="USD">USD</option></select><input id="actAmount" type="number" min="0.01" step="0.01" placeholder="Monto">';
 html+='<div class="actions"><button class="btn primary" onclick="doAction(\''+type+'\')">Confirmar</button><button class="btn ghost" onclick="actionBox.classList.add(\'hidden\')">Cancelar</button></div>';
 box.innerHTML=html;
}
function doAction(type){
 const c=client(), a=Number(document.getElementById('actAmount')?.value||0);
 if(a<=0)return msg('actMsg','Ingresa un monto válido.');
 if(type==='deposit'){c.balance+=a;addMov(c.id,'ABONO',a,'Abono interno');}
 if(type==='withdraw'){if(c.balance<a)return msg('actMsg','Saldo insuficiente.');c.balance-=a;addMov(c.id,'RETIRO',-a,'Retiro interno');}
 if(type==='transfer'||type==='pay'){
   const u=document.getElementById('actUser').value.trim().toLowerCase(),dest=db.clients.find(x=>x.username===u);
   if(!dest)return msg('actMsg','No existe ese usuario.');
   if(dest.id===c.id)return msg('actMsg','No puedes enviarte dinero a ti mismo.');
   if(c.balance<a)return msg('actMsg','Saldo insuficiente.');
   c.balance-=a;dest.balance+=a;addMov(c.id,type==='pay'?'PAGO':'ENVIO',-a,(type==='pay'?'Pago a ':'Envío a ')+dest.username);addMov(dest.id,type==='pay'?'COBRO':'RECEPCION',a,(type==='pay'?'Cobro de ':'Recepción de ')+c.username);
 }
 if(type==='creditPay'){
   const cr=db.credits.find(x=>x.id===Number(document.getElementById('actCredit').value));
   if(!cr)return msg('actMsg','No hay crédito seleccionado.');
   if(c.balance<a)return msg('actMsg','Saldo insuficiente.');
   const a2=Math.min(a,cr.remaining);c.balance-=a2;cr.remaining-=a2;db.creditPayments.push({id:id(),creditId:cr.id,clientId:c.id,amount:a2,at:new Date().toLocaleString('es-PE')});addMov(c.id,'PAGO CRÉDITO',-a2,'Pago crédito #'+cr.id);if(cr.remaining<=0.005)cr.status='paid';
 }
 if(type==='invest'){
   const cur=document.getElementById('actCurrency').value;
   if(cur==='PEN'){if(c.balance<a)return msg('actMsg','Saldo PEN insuficiente.');c.balance-=a;}
   db.investments.unshift({id:id(),clientId:c.id,currency:cur,amount:a,status:'active',at:new Date().toLocaleString('es-PE')});
   if(cur==='PEN')addMov(c.id,'INVERSIÓN',-a,'Inversión PEN');
 }
 save();log('Operación cliente',type);actionBox.classList.add('hidden');msg('clientMsg','Operación realizada correctamente.',true);refreshClient();refreshAdmin();
}
function addMov(cid,type,amount,detail){db.movements.unshift({id:id(),clientId:cid,type,amount,detail,at:new Date().toLocaleString('es-PE'),balanceAfter:db.clients.find(x=>x.id===cid).balance})}

function refreshClient(){
 const c=client();if(!c)return;
 clientName.textContent=c.name;clientUser.textContent='@'+c.username;balance.textContent=money(c.balance);
 pName.textContent=c.name;pDoc.textContent=c.doc;pPhone.textContent=c.phone;pEmail.textContent=c.email;pUser.textContent=c.username;
 const ms=db.movements.filter(x=>x.clientId===c.id);movCount.textContent=ms.length;
 movements.innerHTML=ms.slice(0,20).map(x=>'<p><b>'+esc(x.type)+'</b> · '+money(x.amount)+'<br><span class="muted small">'+esc(x.detail)+' · '+esc(x.at)+'</span></p>').join('')||'<p class="muted">Sin movimientos.</p>';
 const cr=db.credits.filter(x=>x.clientId===c.id);credits.innerHTML=cr.map(x=>'<p>Crédito #'+x.id+' · '+money(x.amount)+' · <b>'+x.status+'</b><br><span class="muted">Saldo: '+money(x.remaining)+'</span></p>').join('')||'<p class="muted">No tienes créditos.</p>';
 const inv=db.investments.filter(x=>x.clientId===c.id);investments.innerHTML=inv.map(x=>'<p>Inversión #'+x.id+' · '+money(x.amount,x.currency)+' · <b>'+x.status+'</b><br><span class="muted">'+x.at+'</span></p>').join('')||'<p class="muted">No tienes inversiones.</p>';
 const camps=db.campaigns.filter(x=>x.active&&c.balance>=x.minBalance);campaigns.innerHTML=camps.map(x=>'<div class="msg"><b>'+esc(x.name)+'</b><br>'+esc(x.description)+'<br><span class="small">Saldo mínimo: '+money(x.minBalance)+'</span></div>').join('')||'<p class="muted">No hay campañas disponibles.</p>';
}
function showAdminTab(t,btn){
 document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));if(btn)btn.classList.add('active');
 let h='';
 if(t==='dash')h='<h2>Resumen</h2><p>Todos los datos de esta versión se guardan localmente en el navegador.</p>';
 if(t==='clients')h='<h2>Clientes</h2><table><tr><th>ID</th><th>Cliente</th><th>Usuario</th><th>Saldo</th></tr>'+db.clients.map(x=>'<tr><td>'+x.id+'</td><td>'+esc(x.name)+'</td><td>@'+esc(x.username)+'</td><td>'+money(x.balance)+'</td></tr>').join('')+'</table>';
 if(t==='movs')h='<h2>Movimientos</h2><table><tr><th>Fecha</th><th>Cliente</th><th>Tipo</th><th>Monto</th></tr>'+db.movements.slice(0,100).map(x=>'<tr><td>'+esc(x.at)+'</td><td>'+esc(db.clients.find(c=>c.id===x.clientId)?.username||'-')+'</td><td>'+esc(x.type)+'</td><td>'+money(x.amount)+'</td></tr>').join('')+'</table>';
 if(t==='credits')h='<h2>Créditos: registrar y aprobar</h2><div class="grid"><div><input id="crUser" placeholder="Usuario del cliente"><input id="crAmount" type="number" min="0.01" step="0.01" placeholder="Monto PEN"><input id="crRate" type="number" min="0" step="0.01" placeholder="Tasa anual %"><input id="crTerm" type="number" min="1" step="1" placeholder="Plazo meses"><button class="btn primary" onclick="createCredit()">Registrar crédito</button></div><div><table><tr><th>ID</th><th>Usuario</th><th>Monto</th><th>Estado</th><th>Acción</th></tr>'+db.credits.map(x=>'<tr><td>'+x.id+'</td><td>'+esc(db.clients.find(c=>c.id===x.clientId)?.username||'-')+'</td><td>'+money(x.amount)+'</td><td>'+x.status+'</td><td>'+(x.status==='pending'?'<button class="btn secondary" onclick="approveCredit('+x.id+')">Aprobar y desembolsar</button>':x.status==='approved'?'<span class="pill">Aprobado</span>':'<span class="pill">'+esc(x.status)+'</span>')+'</td></tr>').join('')+'</table></div></div>';
 if(t==='campaigns')h='<h2>Campañas de crédito</h2><div class="grid"><div><input id="campName" placeholder="Nombre de campaña"><input id="campDesc" placeholder="Descripción"><input id="campMin" type="number" min="0" step="0.01" placeholder="Saldo mínimo PEN"><input id="campMax" type="number" min="0" step="0.01" placeholder="Monto máximo PEN"><input id="campRate" type="number" min="0" step="0.01" placeholder="Tasa anual %"><input id="campTerm" type="number" min="1" placeholder="Plazo máximo meses"><button class="btn primary" onclick="createCampaign()">Registrar campaña</button></div><div>'+db.campaigns.map(x=>'<div class="msg"><b>'+esc(x.name)+'</b><br>'+esc(x.description||'')+'<br><span class="small">Mínimo: '+money(x.minBalance)+' · Máximo: '+money(x.maxAmount||0)+' · Tasa: '+Number(x.rate||0)+'% · Plazo: '+Number(x.term||0)+' meses · '+(x.active?'Activa':'Inactiva')+'</span></div>').join('')+'</div></div>';
 if(t==='invest')h='<h2>Inversiones</h2><table><tr><th>ID</th><th>Usuario</th><th>Moneda</th><th>Monto</th><th>Estado</th></tr>'+db.investments.map(x=>'<tr><td>'+x.id+'</td><td>'+esc(db.clients.find(c=>c.id===x.clientId)?.username||'-')+'</td><td>'+x.currency+'</td><td>'+money(x.amount,x.currency)+'</td><td>'+x.status+'</td></tr>').join('')+'</table>';
 if(t==='investors')h='<h2>Registro de inversores</h2><div class="grid"><div><input id="invName" placeholder="Nombre completo / razón social"><input id="invDoc" placeholder="DNI / RUC"><input id="invContact" placeholder="Teléfono o correo"><input id="invCapital" type="number" min="0.01" step="0.01" placeholder="Capital inicial"><select id="invCurrency"><option value="PEN">PEN</option><option value="USD">USD</option></select><button class="btn primary" onclick="createInvestor()">Registrar inversor</button></div><div><table><tr><th>ID</th><th>Inversor</th><th>Documento</th><th>Capital</th></tr>'+db.investors.map(x=>'<tr><td>'+x.id+'</td><td>'+esc(x.name)+'</td><td>'+esc(x.doc)+'</td><td>'+money(x.capital,x.currency)+'</td></tr>').join('')+'</table></div></div>';
if(t==='capital')h='<h2>Capital registrado</h2><div class="grid3"><div class="card"><span class="muted">Capital PEN</span><h2>'+money(db.capital.filter(x=>x.currency==='PEN').reduce((a,x)=>a+x.amount,0))+'</h2></div><div class="card"><span class="muted">Capital USD</span><h2>'+money(db.capital.filter(x=>x.currency==='USD').reduce((a,x)=>a+x.amount,0),'USD')+'</h2></div><div class="card"><span class="muted">Registros</span><h2>'+db.capital.length+'</h2></div></div><table><tr><th>Fecha</th><th>Inversor</th><th>Concepto</th><th>Moneda</th><th>Monto</th></tr>'+db.capital.map(x=>'<tr><td>'+esc(x.at)+'</td><td>'+esc(x.investorName)+'</td><td>'+esc(x.concept)+'</td><td>'+x.currency+'</td><td>'+money(x.amount,x.currency)+'</td></tr>').join('')+'</table>';
if(t==='audit')h='<h2>Auditoría</h2><table><tr><th>Fecha</th><th>Tipo</th><th>Detalle</th></tr>'+db.audit.slice(0,100).map(x=>'<tr><td>'+esc(x.at)+'</td><td>'+esc(x.type)+'</td><td>'+esc(x.detail)+'</td></tr>').join('')+'</table>';
 adminContent.innerHTML=h||'<p>Sin datos.</p>';refreshAdmin();
}
function refreshAdmin(){
 mClients.textContent=db.clients.length;mBalance.textContent=money(db.clients.reduce((a,c)=>a+c.balance,0));mMovs.textContent=db.movements.length;
}
function createCredit(){
 const u=crUser.value.trim().toLowerCase(),c=db.clients.find(x=>x.username===u),a=Number(crAmount.value),rate=Number(crRate.value),term=Number(crTerm.value);
 if(!c||a<=0||term<=0||rate<0)return alert('Revisa usuario, monto, tasa y plazo.');
 const total=a*(1+rate/100*term/12);
 const cr={id:id(),clientId:c.id,amount:a,total,remaining:total,rate,term,status:'pending',at:new Date().toLocaleString('es-PE'),approvedAt:null};
 db.credits.unshift(cr);save();log('Crédito registrado','Crédito #'+cr.id+' para '+u+' pendiente de aprobación');showAdminTab('credits');
}
function approveCredit(cid){
 const cr=db.credits.find(x=>x.id===Number(cid));if(!cr||cr.status!=='pending')return;
 const c=db.clients.find(x=>x.id===cr.clientId);if(!c)return;
 cr.status='approved';cr.approvedAt=new Date().toLocaleString('es-PE');c.balance+=cr.amount;addMov(c.id,'DESEMBOLSO CRÉDITO',cr.amount,'Crédito aprobado #'+cr.id);save();log('Crédito aprobado','Crédito #'+cr.id+' desembolsado a '+c.username);showAdminTab('credits');refreshClient();
}
function createCampaign(){
 const n=campName.value.trim(),d=campDesc.value.trim(),m=Number(campMin.value)||0,max=Number(campMax.value)||0,rate=Number(campRate.value)||0,term=Number(campTerm.value)||0;
 if(!n)return alert('Ingresa el nombre de la campaña.');
 db.campaigns.unshift({id:id(),name:n,description:d,minBalance:m,maxAmount:max,rate,term,active:true,at:new Date().toLocaleString('es-PE')});save();log('Campaña de crédito','Registrada '+n);showAdminTab('campaigns');
}
function createInvestor(){
 const name=invName.value.trim(),doc=invDoc.value.trim(),contact=invContact.value.trim(),capital=Number(invCapital.value)||0,currency=invCurrency.value;
 if(!name||!doc||capital<=0)return alert('Completa inversor, documento y capital.');
 const inv={id:id(),name,doc,contact,capital,currency,at:new Date().toLocaleString('es-PE')};db.investors.unshift(inv);db.capital.unshift({id:id(),investorId:inv.id,investorName:name,concept:'Capital inicial de inversor',currency,amount:capital,at:inv.at});save();log('Inversor registrado',name+' · '+money(capital,currency));showAdminTab('investors');
}
show('auth');
</script>
</body>
</html>
